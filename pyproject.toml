[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nifty-sentinel-ai"
version = "1.0.0"
description = "NIFTY Sentinel AI - High-Assurance Quantitative Forecasting & Walk-Forward Audit Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "yfinance>=0.2.36",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
]
